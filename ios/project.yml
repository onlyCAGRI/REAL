name: Real
options:
  bundleIdPrefix: com.cagri
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.6.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  Real:
    type: application
    platform: iOS
    sources:
      - path: Real
      - path: Shared
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cagri.real
        PRODUCT_NAME: REAL
        INFOPLIST_FILE: Real/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  RealTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RealTests
    dependencies:
      - target: Real
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cagri.real.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/REAL.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/REAL"
        BUNDLE_LOADER: "$(TEST_HOST)"
  RealUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RealUITests
    dependencies:
      - target: Real
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cagri.real.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Real
schemes:
  Real:
    build:
      targets:
        Real: all
        RealTests: [test]
        RealUITests: [test]
    # Run from Xcode as the optimized Release build without the debugger (smooth like the store app).
    run:
      config: Release
      debugEnabled: false
    test:
      targets:
        - RealTests
        - RealUITests
