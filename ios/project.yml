name: Real
options:
  bundleIdPrefix: com.cagri
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "13"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.6.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  Real:
    type: application
    platform: iOS
    sources:
      - path: Real
      - path: Shared
      - path: ../android/app/src/main/assets/i18n/en.json
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      # Share → REAL (App Groups), push, Sign in with Apple, time-sensitive alerts and share links: paid team only.
      - target: RealShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cagri.real
        PRODUCT_NAME: REAL
        INFOPLIST_FILE: Real/Info.plist
        # Empty for Xcode's automatic signing; the TestFlight CI sets REAL_PROFILE to the App Store profile. Set here
        # (not on the command line) so the Swift package targets never see a provisioning profile.
        PROVISIONING_PROFILE_SPECIFIER: "$(REAL_PROFILE)"
        CODE_SIGN_ENTITLEMENTS: Real/Real.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  # Share → REAL: the system share sheet's REAL entry (leaves shares in the App Group inbox; the app imports them).
  RealShare:
    type: app-extension
    platform: iOS
    sources:
      - path: RealShare
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cagri.real.share
        PRODUCT_NAME: RealShare
        INFOPLIST_FILE: RealShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: RealShare/RealShare.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(REAL_SHARE_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  RealTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RealTests
    dependencies:
      - target: Real
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cagri.real.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/REAL.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/REAL"
        BUNDLE_LOADER: "$(TEST_HOST)"
  RealUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RealUITests
    dependencies:
      - target: Real
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cagri.real.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Real
schemes:
  Real:
    build:
      targets:
        Real: all
        RealTests: [test]
        RealUITests: [test]
    # Run from Xcode as the optimized Release build without the debugger (smooth like the store app).
    run:
      config: Release
      debugEnabled: false
    test:
      targets:
        - RealTests
        - RealUITests
