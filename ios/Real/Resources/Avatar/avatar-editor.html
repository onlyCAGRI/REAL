<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>REAL Avatar</title>
<!--
  REAL avatar editor (Humation 1 parts, MIT). One page for Android (AvatarEditorActivity, WebView) and iOS
  (AvatarEditorView, WKWebView). The app puts the saved state in place of __SAVED_STATE__ (base64 JSON) and receives
  the result through REALAvatar.save → Android.saveAvatar(state, png) / webkit.messageHandlers.avatar.
-->
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --ink: #f4f4f6;
  --muted: #8e8e98;
  --faint: #55555e;
  --avatar-bg: #F6F5F4;
  --font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior-y: contain; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font); -webkit-font-smoothing: antialiased;
  padding: 4px max(14px, env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* Stage: the avatar large on its own colour */
.stage { position: relative; height: min(44vh, 360px); min-height: 260px; border-radius: 38px; background: var(--avatar-bg); overflow: hidden;
  display: flex; align-items: flex-end; justify-content: center; transition: background .3s;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -40px 60px rgba(0,0,0,.06); }
.stage .avatar { width: min(78%, 330px); aspect-ratio: 1; }
.stage .avatar svg { width: 100%; height: 100%; display: block; }
.stage .avatar svg > rect:first-child { fill: transparent; }
.dice { position: absolute; left: 14px; bottom: 14px; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(255,255,255,.55); color: #111; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 6px 18px rgba(0,0,0,.18); }
.dice:active { transform: scale(.94) rotate(-12deg); }
.dice svg { width: 22px; height: 22px; }

/* Tabs: icon + label, a short line under the chosen one */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 10px; color: var(--faint); font-size: 12.5px; font-weight: 600; position: relative; transition: color .2s; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--ink); }
.tab.on::after { content: ""; position: absolute; bottom: 0; width: 22px; height: 3px; border-radius: 3px; background: var(--ink); }

/* Colours of the open tab, right in the page */
.tone { display: flex; flex-direction: column; gap: 8px; }
.tone-h { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; padding: 0 2px; }
.tone-h::-webkit-scrollbar { display: none; }
.tone-h button { color: var(--faint); font-size: 13px; font-weight: 600; white-space: nowrap; padding: 2px 0; }
.tone-h button.on { color: var(--ink); }
.chips { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px 6px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
.chip.on { box-shadow: 0 0 0 2.5px var(--bg), 0 0 0 4.5px var(--ink); }
.chip.custom { display: grid; place-items: center; background: conic-gradient(#f44, #fd4, #4d6, #4cf, #66f, #e5e, #f44); }
.chip.custom::after { content: "+"; width: 26px; height: 26px; border-radius: 50%; background: #111; display: grid; place-items: center; font-size: 17px; line-height: 1; color: #fff; }

/* Parts: small round choices */
.parts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px 10px; padding: 2px; }
/* Unchosen parts as light line drawings on dark circles; the chosen one on the avatar's own colour. */
.part { position: relative; aspect-ratio: 1; border-radius: 50%; background: #1a1a1f; overflow: hidden; transition: transform .15s, box-shadow .15s; }
.part img { position: absolute; inset: 9%; width: 82%; height: 82%; object-fit: contain; filter: invert(1) brightness(.95); }
.part.on { background: var(--avatar-bg); box-shadow: 0 0 0 2.5px var(--bg), 0 0 0 4.5px var(--ink); }
.part.on img { filter: none; }
.part:active { transform: scale(.93); }

.note { color: var(--faint); font-size: 11px; text-align: center; padding-top: 6px; }
.loading, .error { text-align: center; color: var(--muted); padding: 40px 10px; line-height: 1.5; align-self: center; }
.error { color: #ffa29b; }

/* Save, pinned to the bottom */
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 14px max(14px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  background: linear-gradient(180deg, rgba(0,0,0,0), #000 38%); }
.save { display: block; width: 100%; max-width: 560px; margin: 0 auto; height: 56px; border-radius: 99px; font-weight: 650; font-size: 16px;
  background: linear-gradient(180deg, #fff, #e2e4e8); color: #0c0d10; box-shadow: inset 0 1px 0 #fff, 0 10px 26px rgba(0,0,0,.55); }
.save[disabled] { opacity: .6; }
.save:active { transform: scale(.985); }

/* Custom colour sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .18s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 41; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; padding: 12px 16px 16px; border-radius: 32px;
  background: rgba(28,28,32,.96); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 28px 80px rgba(0,0,0,.6);
  transform: translateY(calc(100% + 30px)); opacity: 0; pointer-events: none; transition: transform .26s cubic-bezier(.16,1,.3,1), opacity .18s; }
.sheet.open { transform: none; opacity: 1; pointer-events: auto; }
.handle { width: 38px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.22); margin: 0 auto 12px; }
.sv { position: relative; height: 160px; border-radius: 22px; overflow: hidden; touch-action: none; }
.sv::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, #fff, rgba(255,255,255,0)); }
.sv::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, #000, rgba(0,0,0,0)); }
.cursor { position: absolute; z-index: 2; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.6); pointer-events: none; }
.hue { width: 100%; height: 30px; margin: 12px 0 8px; appearance: none; -webkit-appearance: none; background: transparent; }
.hue::-webkit-slider-runnable-track { height: 14px; border-radius: 99px; background: linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
.hue::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -6px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
.sheet-a { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
.hex { flex: 1; min-width: 0; height: 48px; border-radius: 99px; background: rgba(255,255,255,.08); border: 0; color: #fff; padding: 0 18px; font: 600 15px var(--font); outline: none; }
.sheet-a button { height: 48px; padding: 0 22px; border-radius: 99px; font-weight: 650; background: linear-gradient(180deg, #fff, #e2e4e8); color: #0c0d10; }
@media (min-width: 520px) { .parts { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="stage" id="stage">
    <div class="avatar" id="preview"><div class="loading">Avatar yükleniyor…</div></div>
    <button class="dice" id="randomize" type="button" aria-label="Rastgele avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/></svg>
    </button>
  </section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Parçalar"></nav>
  <section class="tone" aria-label="Renkler"><div class="tone-h" id="toneTabs"></div><div class="chips" id="chips"></div></section>
  <div class="parts" id="parts" role="listbox" aria-label="Seçenekler"></div>
  <div class="note">Humation 1 avatar parçaları · MIT lisansı</div>
</div>
<div class="savebar"><button class="save" id="save" type="button">Kaydet</button></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Özel renk">
  <div class="handle"></div>
  <div class="sv" id="sv"><div class="cursor" id="cursor"></div></div>
  <input class="hue" id="hue" type="range" min="0" max="360" step="1" aria-label="Ton" />
  <div class="sheet-a"><input class="hex" id="hexField" type="text" maxlength="7" spellcheck="false" aria-label="Renk kodu" /><button id="apply" type="button">Tamam</button></div>
</div>
<script type="module">
const $ = (id) => document.getElementById(id);
// The phones' bridge: Android injects "Android", iOS registers webkit.messageHandlers.avatar.
const REALAvatar = {
  save(state, png) {
    if (window.Android?.saveAvatar) return window.Android.saveAvatar(state, png);
    if (window.webkit?.messageHandlers?.avatar) return window.webkit.messageHandlers.avatar.postMessage({ state, png });
    throw new Error('no bridge');
  }
};
try {
  const core = await import('https://cdn.jsdelivr.net/npm/@humation/core@1.0.3/+esm');
  const assets = await import('https://cdn.jsdelivr.net/npm/@humation/assets-humation-1@1.0.3/+esm');
  const { createAvatar, createPartPreview, getPartsForSlot } = core;
  const { humation1 } = assets;

  let saved = null;
  try { const raw = atob('__SAVED_STATE__'); if (raw) saved = JSON.parse(raw); } catch (_) {}
  const state = saved || { selections: { ...humation1.defaults.selections }, colors: { ...humation1.defaults.colors }, background: humation1.defaults.background || 'F6F5F4' };
  state.selections = { ...humation1.defaults.selections, ...(state.selections || {}) };
  state.colors = { ...humation1.defaults.colors, ...(state.colors || {}) };
  state.background = state.background || humation1.defaults.background || 'F6F5F4';

  const ICON = {
    head: '<circle cx="12" cy="9" r="5"/><path d="M5 21a7 7 0 0 1 14 0"/>',
    body: '<path d="M8 3h8l4 4-3 3v11H7V10L4 7z"/>',
    item: '<path d="M4 11h16v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM3 7h18v4H3zM12 7v14M12 7S10 3 7.5 3a2 2 0 0 0 0 4M12 7s2-4 4.5-4a2 2 0 0 1 0 4"/>',
    glasses: '<circle cx="7" cy="14" r="4"/><circle cx="17" cy="14" r="4"/><path d="M11 14h2M3 14 4.5 6M21 14 19.5 6"/>'
  };
  const slots = [['head', 'Kafa'], ['body', 'Gövde'], ['item', 'Eşya'], ['glasses', 'Gözlük']];
  // Which colours belong to which tab (the background is always there).
  const TONES = { head: [['hair', 'Saç'], ['skin', 'Ten']], body: [['clothes', 'Üst'], ['bottom', 'Alt']], item: [['stroke', 'Çizgi']], glasses: [['stroke', 'Çizgi']] };
  const PRESETS = {
    skin: ['FCE5D3', 'F6CFAE', 'EBB48D', 'D19A6A', 'A86E46', '7A4B2D', '4E3021'],
    hair: ['1C1714', '3F2A1E', '6B4226', 'A0693A', 'D6A45E', 'EADBB8', 'A9A9AF', 'C2412D', '3B5BDB', 'DE6D98'],
    clothes: ['FFFFFF', '4558C8', '36A269', 'EE5E37', 'DE6D98', 'E5B84D', '8666D6', '292B2D'],
    bottom: ['263C74', '292B2D', '5A4636', '2E8793', 'A83B5D', 'B6B12E', 'EFF0F6'],
    stroke: ['000000', '1F1F24', '3B2F2F', '2C3E50', '5C4033', 'FFFFFF'],
    background: ['F6F5F4', 'EFF0F6', 'DFF37D', 'D9B8F3', '78C9F2', '8ED9B6', 'E9786A', 'E5B84D', '292B2D']
  };
  let active = 'head', tone = 'hair';
  const hex = (v, f) => { const s = String(v || f || '000000').replace('#', ''); return (s.length === 6 ? s : f).toUpperCase(); };
  const opts = () => ({ selections: state.selections, colors: state.colors, background: state.background, crop: 'avatar' });
  const colorOf = (id) => id === 'background' ? hex(state.background, 'F6F5F4') : hex(state.colors[id], humation1.defaults.colors[id] || '000000');
  function renderPreview() {
    document.documentElement.style.setProperty('--avatar-bg', '#' + colorOf('background'));
    $('preview').innerHTML = createAvatar(humation1, opts()).toString();
  }
  function renderTabs() {
    $('tabs').innerHTML = slots.map(([id, label]) => `<button class="tab ${id === active ? 'on' : ''}" role="tab" aria-selected="${id === active}" data-slot="${id}" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[id]}</svg>${label}</button>`).join('');
  }
  function renderTone() {
    const list = [...TONES[active], ['background', 'Arka plan']];
    if (!list.some(([id]) => id === tone)) tone = list[0][0];
    $('toneTabs').innerHTML = list.map(([id, label]) => `<button class="${id === tone ? 'on' : ''}" data-tone="${id}" type="button">${label}</button>`).join('');
    const cur = colorOf(tone), presets = PRESETS[tone] || [];
    $('chips').innerHTML = presets.map((c) => `<button class="chip ${c === cur ? 'on' : ''}" data-chip="${c}" type="button" style="background:#${c}" aria-label="#${c}"></button>`).join('') +
      (presets.includes(cur) ? '' : `<button class="chip on" data-chip="${cur}" type="button" style="background:#${cur}" aria-label="#${cur}"></button>`) +
      '<button class="chip custom" data-act="custom" type="button" aria-label="Özel renk"></button>';
  }
  function renderParts() {
    const chosen = state.selections[active];
    $('parts').innerHTML = '';
    for (const part of getPartsForSlot(humation1, active)) {
      const b = document.createElement('button'), on = chosen === part.name || chosen === part.id;
      b.type = 'button'; b.className = 'part' + (on ? ' on' : ''); b.title = part.name; b.setAttribute('role', 'option'); b.setAttribute('aria-selected', String(on));
      try { const img = document.createElement('img'); img.alt = part.name; img.src = createPartPreview(humation1, part, { colors: { ...state.colors, stroke: '000000' } }).toDataUri(); b.appendChild(img); }
      catch (_) { b.textContent = '•'; }
      b.onclick = () => { state.selections[active] = part.name; renderPreview(); renderParts(); };
      $('parts').appendChild(b);
    }
  }
  function setColor(id, value) {
    const c = String(value || '').replace('#', '').toUpperCase(); if (!/^[0-9A-F]{6}$/.test(c)) return;
    if (id === 'background') state.background = c; else state.colors[id] = c;
    renderPreview(); renderTone();
  }
  $('tabs').addEventListener('click', (e) => { const t = e.target.closest('[data-slot]'); if (!t) return; active = t.dataset.slot; tone = TONES[active][0][0]; renderTabs(); renderTone(); renderParts(); });
  $('toneTabs').addEventListener('click', (e) => { const t = e.target.closest('[data-tone]'); if (t) { tone = t.dataset.tone; renderTone(); } });
  $('chips').addEventListener('click', (e) => { const t = e.target.closest('[data-chip],[data-act]'); if (!t) return; if (t.dataset.act === 'custom') openSheet(); else setColor(tone, t.dataset.chip); });
  $('randomize').onclick = () => {
    for (const [slot] of slots) { const list = getPartsForSlot(humation1, slot); if (list.length) state.selections[slot] = list[Math.floor(Math.random() * list.length)].name; }
    for (const k of ['hair', 'skin', 'clothes', 'bottom']) { const p = PRESETS[k]; state.colors[k] = p[Math.floor(Math.random() * p.length)]; }
    renderPreview(); renderTone(); renderParts();
  };

  // ---- Custom colour ----
  let H = 0, S = 0, V = 100;
  function hsvToHex(h, s, v) { s /= 100; v /= 100; const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c; let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
    const q = (n) => Math.round((n + m) * 255).toString(16).padStart(2, '0').toUpperCase(); return q(r) + q(g) + q(b); }
  function hexToHsv(value) { const s = String(value || '000000').replace('#', '').padEnd(6, '0').slice(0, 6);
    const r = parseInt(s.slice(0, 2), 16) / 255, g = parseInt(s.slice(2, 4), 16) / 255, b = parseInt(s.slice(4, 6), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let h = 0; if (d) { if (mx === r) h = 60 * (((g - b) / d) % 6); else if (mx === g) h = 60 * ((b - r) / d + 2); else h = 60 * ((r - g) / d + 4); } if (h < 0) h += 360;
    return [h, mx === 0 ? 0 : d / mx * 100, mx * 100]; }
  function refresh() {
    const v = hsvToHex(H, S, V);
    $('sv').style.backgroundColor = `hsl(${H},100%,50%)`; $('cursor').style.left = S + '%'; $('cursor').style.top = (100 - V) + '%'; $('cursor').style.background = '#' + v;
    $('hue').value = String(Math.round(H)); $('hexField').value = '#' + v; setColor(tone, v);
  }
  function openSheet() { [H, S, V] = hexToHsv(colorOf(tone)); refresh(); $('scrim').classList.add('open'); $('sheet').classList.add('open'); }
  function closeSheet() { $('scrim').classList.remove('open'); $('sheet').classList.remove('open'); }
  const sv = $('sv'); let drag = false;
  const fromPointer = (ev) => { const r = sv.getBoundingClientRect(); S = Math.max(0, Math.min(r.width, ev.clientX - r.left)) / r.width * 100; V = (1 - Math.max(0, Math.min(r.height, ev.clientY - r.top)) / r.height) * 100; refresh(); };
  sv.addEventListener('pointerdown', (e) => { drag = true; sv.setPointerCapture?.(e.pointerId); fromPointer(e); });
  sv.addEventListener('pointermove', (e) => { if (drag) fromPointer(e); });
  sv.addEventListener('pointerup', () => { drag = false; }); sv.addEventListener('pointercancel', () => { drag = false; });
  $('hue').addEventListener('input', () => { H = Number($('hue').value); refresh(); });
  $('hexField').addEventListener('change', () => { const v = $('hexField').value.replace('#', '').toUpperCase(); if (/^[0-9A-F]{6}$/.test(v)) { [H, S, V] = hexToHsv(v); refresh(); } });
  $('apply').onclick = closeSheet; $('scrim').onclick = closeSheet;

  // ---- Save: 512 px PNG of the avatar + its state ----
  function svgToPng(svg) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' })), img = new Image();
      img.onload = () => { try { const c = document.createElement('canvas'); c.width = 512; c.height = 512; c.getContext('2d').drawImage(img, 0, 0, 512, 512); URL.revokeObjectURL(url); resolve(c.toDataURL('image/png')); } catch (e) { URL.revokeObjectURL(url); reject(e); } };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); }; img.src = url;
    });
  }
  $('save').onclick = async () => {
    const b = $('save'); b.disabled = true; b.textContent = 'Kaydediliyor…';
    try { REALAvatar.save(JSON.stringify(state), await svgToPng(createAvatar(humation1, opts()).toString())); }
    catch (e) { b.disabled = false; b.textContent = 'Kaydet'; }
  };
  renderTabs(); renderTone(); renderParts(); renderPreview();
} catch (e) {
  $('preview').innerHTML = '<div class="error">Avatar parçaları yüklenemedi.<br>İnternet bağlantını kontrol et.</div>';
}
</script>
</body>
</html>
