name: iOS

on:
  push:
    branches: [ios]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.split("iOS-")[-1].split("-"))
              for d in devices:
                  if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]:
                      if best is None or version > best[0]:
                          best = (version, d["udid"], d["name"])
          print(best[1])
          print(best, file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          mkdir -p build
          set +e
          xcodebuild test             -project Real.xcodeproj -scheme Real             -destination "id=${{ steps.sim.outputs.udid }}"             -derivedDataPath build             -resultBundlePath build/TestResults.xcresult             CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= > build/xcodebuild.log 2>&1
          status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* " build/xcodebuild.log | tail -300
          exit $status

      - name: Screenshots
        timeout-minutes: 10
        run: |
          set -x
          UDID=${{ steps.sim.outputs.udid }}
          APP=build/Build/Products/Debug-iphonesimulator/REAL.app
          mkdir -p screenshots
          # perl alarm = portable timeout on macOS runners
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          codesign -dv "$APP" || true
          # Fresh boot: the test run can leave the device in a state where launch blocks.
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          t 120 xcrun simctl install "$UDID" "$APP"
          sleep 10
          for screen in home category builtin detail checklist planner; do
            xcrun simctl terminate "$UDID" com.cagri.real || true
            t 60 xcrun simctl launch "$UDID" com.cagri.real -REALDemo -REALScreen "$screen" || echo "launch failed: $screen"
            sleep 6
            t 30 xcrun simctl io "$UDID" screenshot "screenshots/$screen.png" || true
          done
          ls -la screenshots
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "REAL"' --style compact | tail -40 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/screenshots
          if-no-files-found: ignore

      - name: Package simulator app
        if: success()
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/REAL-simulator.zip" REAL.app

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: REAL-simulator-app
          path: REAL-simulator.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ios/build/xcodebuild.log
            ios/build/TestResults.xcresult
          if-no-files-found: ignore
