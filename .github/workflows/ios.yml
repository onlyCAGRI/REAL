name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  # A push whose commit message contains [appetize] also builds the Appetize simulator zip; one containing [showcase]
  # takes the presentation screenshots instead of the compile check; one containing [testflight] also signs a device
  # build and uploads it to TestFlight (the "Run workflow" button only shows when this file is on the default branch).
  workflow_dispatch:
    inputs:
      mode:
        description: "compile = only check that it builds; appetize = simulator app zip; test = UI tests + screenshots; showcase = presentation screenshots; testflight = signed build to TestFlight"
        type: choice
        options: [compile, appetize, test, showcase, testflight]
        default: compile

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Intel runner: the arm64 macOS pool is capacity-constrained (jobs were dropped unstarted).
    # macos-26 (Apple Silicon) is faster, but on 2026-10-13 and 2026-10-14 its jobs sat queued without a runner;
    # the Intel image always picks up. 80 minutes leaves room for the Appetize package on manual runs.
    runs-on: macos-15-intel
    timeout-minutes: 80
    env:
      # Showcase: only ShowcaseTests, on the calm presentation dataset. SHOTS: any run that takes screenshots.
      SHOWCASE: ${{ inputs.mode == 'showcase' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[showcase]')) }}
      SHOTS: ${{ inputs.mode == 'test' || inputs.mode == 'showcase' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[showcase]')) }}
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          # Liquid Glass (.glassEffect) needs the iOS 26 SDK / Swift 6.2: select the newest Xcode 26 on the runner.
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $XC"
          if [ -z "$XC" ]; then echo "Xcode 26 not found"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Inject Firebase config
        # From repository secrets only: neither file is committed (the repository is public).
        env:
          PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
          APP_CHECK_DEBUG_TOKEN: ${{ secrets.IOS_APP_CHECK_DEBUG_TOKEN }}
        run: |
          if [ -n "$PLIST_B64" ]; then
            printf '%s' "$PLIST_B64" | base64 --decode > Real/GoogleService-Info.plist
            echo "GoogleService-Info.plist injected"
          fi
          if [ -n "$APP_CHECK_DEBUG_TOKEN" ]; then
            echo "enum BuildSecrets { static let appCheckDebugToken = \"$APP_CHECK_DEBUG_TOKEN\" }" > Real/App/BuildSecrets.swift
            echo "App Check debug token injected"
          fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # Pushes and "compile" runs only check that the app builds: no tests, screenshots or app package.
      - name: Compile check
        if: (github.event_name == 'push' && env.SHOWCASE != 'true') || inputs.mode == 'compile'
        run: |
          mkdir -p build
          set +e
          xcodebuild build -project Real.xcodeproj -scheme Real -configuration Debug             -sdk iphonesimulator -destination "generic/platform=iOS Simulator"             -derivedDataPath build/compile ONLY_ACTIVE_ARCH=YES             CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= > build/xcodebuild.log 2>&1
          status=$?
          grep -E "error:|\*\* BUILD" build/xcodebuild.log | sort -u | head -200
          # Compiler errors also as annotations (readable through the public checks API).
          grep -E "^/.*:[0-9]+:[0-9]+: error: " build/xcodebuild.log | sort -u | head -40 | sed -E 's#^.*/ios/([^:]+):([0-9]+):[0-9]+: error: (.*)$#::error file=ios/\1,line=\2::\3#'
          exit $status

      - name: Pick simulator
        id: sim
        if: env.SHOTS == 'true'
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.split("iOS-")[-1].split("-"))
              for d in devices:
                  if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]:
                      if best is None or version > best[0]:
                          best = (version, d["udid"], d["name"])
          print(best[1])
          print(best, file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        # "test" runs: UI tests and screenshots; "showcase" runs: only the presentation screenshots.
        if: env.SHOTS == 'true'
        run: |
          mkdir -p build
          set +e
          ONLY=""
          if [ "$SHOWCASE" = "true" ]; then ONLY="-only-testing:RealUITests/ShowcaseTests"; fi
          xcodebuild test             -project Real.xcodeproj -scheme Real             -destination "id=${{ steps.sim.outputs.udid }}"             -derivedDataPath build             -resultBundlePath build/TestResults.xcresult $ONLY             CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= > build/xcodebuild.log 2>&1
          status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* " build/xcodebuild.log | tail -300
          exit $status

      - name: Export screenshots
        if: always() && env.SHOTS == 'true'
        run: |
          mkdir -p screenshots raw
          xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path raw || true
          python3 - <<'PY'
          import json, os, shutil
          try:
              manifest = json.load(open("raw/manifest.json"))
          except Exception as e:
              print("no manifest", e); manifest = []
          for test in manifest:
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  base = name.split("_")[0] if "_" in name else os.path.splitext(name)[0]
                  ext = os.path.splitext(a["exportedFileName"])[1] or ".png"
                  shutil.copy(os.path.join("raw", a["exportedFileName"]), os.path.join("screenshots", base + ext))
                  print(test.get("testIdentifier"), "->", base + ext)
          PY
          ls -la screenshots

      - name: Upload screenshots
        if: always() && env.SHOTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SHOWCASE == 'true' && 'showcase-screenshots' || 'screenshots' }}
          path: ios/screenshots
          if-no-files-found: ignore

      - name: Package simulator app (Appetize)
        # "appetize" runs only.
        if: success() && (inputs.mode == 'appetize' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[appetize]')))
        run: |
          mkdir -p build   # the test step that used to create it is skipped on manual runs
          xcodebuild build -project Real.xcodeproj -scheme Real -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build-appetize ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= > build/appetize.log 2>&1 || { tail -80 build/appetize.log; exit 1; }
          cd build-appetize/Build/Products/Release-iphonesimulator
          lipo -info REAL.app/REAL
          zip -qry "$GITHUB_WORKSPACE/REAL-simulator.zip" REAL.app

      - name: Upload simulator app
        if: success() && (inputs.mode == 'appetize' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[appetize]')))
        uses: actions/upload-artifact@v4
        with:
          name: REAL-simulator-app
          path: REAL-simulator.zip

      - name: Archive and upload to TestFlight
        # "testflight" runs only. Manual signing with the team's Apple Distribution certificate (.p12) and the "REAL App
        # Store" profile from repository secrets: every runner is a fresh Mac, so certificates Xcode creates on its own
        # lose their private key with the machine. The App Store Connect API key only uploads. All are deleted afterwards.
        # Build number = workflow run number, so every upload is higher than the last (the update gate reads it too).
        if: success() && (inputs.mode == 'testflight' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight]')))
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
          SHARE_APPSTORE_PROFILE: ${{ secrets.IOS_SHARE_APPSTORE_PROFILE }}
          TEAM_ID: VW6K9YCWLJ
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p build
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          # Signing identity in a throwaway keychain, the profile where Xcode looks for it.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"; KC_PASS=$(uuidgen)
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"; printf '%s' "$APPSTORE_PROFILE" | base64 --decode > "$dir/real-appstore.mobileprovision"
            printf '%s' "$SHARE_APPSTORE_PROFILE" | base64 --decode > "$dir/real-share-appstore.mobileprovision"
          done
          echo "::warning title=signing identities::$(security find-identity -v -p codesigning "$KEYCHAIN" | head -3 | tr '\n' ' ')"
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.cagri.real</key><string>REAL App Store</string><key>com.cagri.real.share</key><string>REAL Share App Store</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set +e
          xcodebuild archive -project Real.xcodeproj -scheme Real -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/REAL.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            REAL_PROFILE="REAL App Store" REAL_SHARE_PROFILE="REAL Share App Store" OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER > build/archive.log 2>&1
          status=$?
          grep -E "error:|\*\* ARCHIVE" build/archive.log | sort -u | head -80
          if [ $status -ne 0 ]; then rm -f "$KEY"; tail -60 build/archive.log; exit $status; fi
          # Signing facts as annotations (readable on the run page without signing in to GitHub).
          sign_facts() { codesign -dvv "$1" 2>&1 | grep -E "^(Authority|TeamIdentifier|Identifier)=" | tr '\n' ' '; }
          echo "::warning title=archive signature::$(sign_facts build/REAL.xcarchive/Products/Applications/*.app)"
          # Export (re-signs for App Store with the distribution certificate), check, then upload separately, so a
          # failure says which of the two went wrong.
          xcodebuild -exportArchive -archivePath build/REAL.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export > build/export.log 2>&1
          status=$?
          grep -E "error|EXPORT" build/export.log | tail -40
          if [ $status -ne 0 ]; then rm -f "$KEY"; echo "::error title=export::$(grep -m3 'error' build/export.log | tr '\n' ' ')"; exit $status; fi
          IPA=$(ls build/export/*.ipa | head -1)
          (cd build && rm -rf ipa && mkdir ipa && cd ipa && unzip -q "../../$IPA")
          APP=$(ls -d build/ipa/Payload/*.app | head -1)
          echo "::warning title=export signature::$(sign_facts "$APP")"
          codesign --verify --deep --strict -vv "$APP" > build/verify.log 2>&1 || echo "::error title=codesign verify::$(tail -5 build/verify.log | tr '\n' ' ')"
          mkdir -p ~/.appstoreconnect/private_keys && cp "$KEY" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > build/upload.log 2>&1
          status=$?
          rm -f "$KEY" ~/.appstoreconnect/private_keys/AuthKey_*.p8
          security delete-keychain "$KEYCHAIN" || true
          tail -30 build/upload.log
          if [ $status -ne 0 ]; then echo "::error title=upload::$(grep -m3 -iE 'error|invalid' build/upload.log | tr '\n' ' ')"; exit $status; fi
          echo "Uploaded build $BUILD_NUMBER"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ios/build/xcodebuild.log
            ios/build/TestResults.xcresult
            ios/build/archive.log
            ios/build/export.log
            ios/build/verify.log
            ios/build/upload.log
          if-no-files-found: ignore
